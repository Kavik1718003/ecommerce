<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cartiva - Manage Orders</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/admin.css">

</head>


<body>


    <!-- =====================================================
         ADMIN NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="logo">
            Cartiva Admin
        </div>


        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="admin-products.html">
                Products
            </a>

            <a href="admin-inventory.html">
                Inventory
            </a>

            <a href="admin-orders.html">
                Orders
            </a>

            <a href="admin-users.html">
                Customers
            </a>

            <a href="#" id="adminLogout">
                Logout
            </a>

        </nav>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-container">


        <h1>
            Manage Orders
        </h1>


        <p class="admin-welcome">
            View customer orders and update order status.
        </p>


        <!-- =================================================
             ORDER MESSAGE
        ================================================== -->

        <p id="orderMessage"
            class="admin-message">
        </p>



        <!-- =================================================
             ORDERS CONTAINER
        ================================================== -->

        <section>

            <div id="adminOrdersContainer"
                class="dashboard-grid">

                <p>
                    Loading orders...
                </p>

            </div>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/admin.js"></script>

    <script src="js/admin-orders.js"></script>
