<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartiva - Admin Login</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">

</head>


<body>


    <!-- ===============================
         NAVBAR
    ================================ -->

    <header class="navbar">

        <div class="logo">
            Cartiva Admin
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Customer Login
            </a>

        </nav>

    </header>


    <!-- ===============================
         ADMIN LOGIN
    ================================ -->

    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Admin Login
            </h1>

            <p>
                Login to manage Cartiva
            </p>


            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login as Admin
                </button>


                <!-- MESSAGE -->

                <p
                    id="adminLoginMessage"
                    class="form-message"
                ></p>


            </form>


            <div class="auth-link">

                <p>
                    Customer?
                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>


        </div>

    </main>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="js/admin.js"></script>

</body>

</html>
