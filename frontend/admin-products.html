<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartiva - Manage Products</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/admin.css">

</head>


<body>


    <!-- =====================================================
         ADMIN NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="logo">
            Cartiva Admin
        </div>


        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="admin-products.html">
                Products
            </a>

            <a href="admin-inventory.html">
                Inventory
            </a>

            <a href="admin-orders.html">
                Orders
            </a>

            <a href="admin-users.html">
                Customers
            </a>

            <a href="#" id="adminLogout">
                Logout
            </a>

        </nav>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-container">


        <h1>
            Manage Products
        </h1>


        <p class="admin-welcome">
            Add, view and manage Cartiva products.
        </p>



        <!-- =================================================
             ADD PRODUCT
        ================================================== -->

        <section class="admin-form-card">

            <h2>
                Add New Product
            </h2>


            <form id="productForm">


                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >


                <input
                    type="number"
                    id="categoryId"
                    placeholder="Category ID"
                    min="1"
                    required
                >


                <textarea
                    id="productDescription"
                    placeholder="Product Description"
                    required
                ></textarea>


                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >


                <input
                    type="number"
                    id="productDiscount"
                    placeholder="Discount %"
                    value="0"
                    min="0"
                    step="0.01"
                >


                <input
                    type="number"
                    id="productStock"
                    placeholder="Stock"
                    min="0"
                    required
                >


                <input
                    type="text"
                    id="productImage"
                    placeholder="Image file name"
                >


                <button
                    type="submit"
                    class="admin-button"
                >
                    Add Product
                </button>


            </form>


            <p id="productMessage"
               class="admin-message">
            </p>


        </section>



        <!-- =================================================
             EXISTING PRODUCTS
        ================================================== -->

        <section class="admin-section">


            <h2>
                Existing Products
            </h2>


            <div
                id="adminProductsContainer"
                class="dashboard-grid"
            >

                <p>
                    Loading products...
                </p>

            </div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/admin.js"></script>


</body>

</html>
